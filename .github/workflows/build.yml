# Copyright (C) 2026 Jorge Juarez <contacto@jorgejuarez.net>
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Tests on every change; macOS and Windows installers when a version is released.
#
#   - push / pull request       → tests
#   - tag v*  (e.g. v0.2.0)     → tests + installers + GitHub Release
#   - manual (Actions → Run)    → tests + installers as downloadable artifacts

name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Run tests
        run: npm test

      - name: Check translations are complete
        run: npm run i18n:check

      - name: Check syntax
        run: |
          node --check main.js
          node --check preload.js
          node --check i18n.js

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the package.json version ($PKG)"
            exit 1
          fi

  build:
    name: Installers (${{ matrix.name }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            script: dist:mac
            files: |
              dist/*.dmg
              dist/*.zip
          - name: Windows
            os: windows-latest
            script: dist:win
            files: |
              dist/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        shell: bash
        run: npm run ${{ matrix.script }} -- --publish never
        env:
          # No certificates yet: builds are unsigned.
          # To sign them, add the secrets and remove this line (see README).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: drawnie-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release with the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh artifacts
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Drawnie $GITHUB_REF_NAME" \
            --generate-notes
