#
# Publishes the website in site/ to GitHub Pages.
# The README screenshots are copied in at build time.

name: Website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/screenshots/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -R site/. _site/
          mkdir -p _site/assets
          cp docs/screenshots/*.png _site/assets/
          # Cache busting: browsers fetch the new CSS and JS after every deploy.
          sed -i -E "s/(style\.css|main\.js)\"/\1?v=${GITHUB_SHA::7}\"/g" _site/index.html
          grep -E 'style\.css\?v=|main\.js\?v=' _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
