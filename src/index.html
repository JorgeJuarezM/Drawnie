<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Drawnie</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="titlebar">
    <div class="doc">
      <div class="history-btns">
        <button id="btn-undo" class="icon-btn" data-i18n-title="Undo"></button>
        <button id="btn-redo" class="icon-btn" data-i18n-title="Redo"></button>
      </div>
      <div class="doc-name">
        <span id="doc-title"></span>
        <span id="doc-status"></span>
      </div>
    </div>
    <nav id="toolbar" data-i18n-aria-label="Tools"></nav>
    <div class="zoom">
      <button id="zoom-out" class="icon-btn" data-i18n-title="Zoom Out"></button>
      <button id="zoom-label" data-i18n-title="Click: 100% / Fit">100%</button>
      <button id="zoom-in" class="icon-btn" data-i18n-title="Zoom In"></button>
      <span class="sep"></span>
      <button id="theme-toggle" class="icon-btn"></button>
    </div>
  </header>

  <div id="subbar"></div>

  <main id="stage" class="grid">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
      <defs id="defs"></defs>
      <g id="world">
        <g id="content"></g>
        <g id="live"></g>
      </g>
      <g id="overlay"></g>
    </svg>
    <div id="editor-layer"></div>
    <div id="empty-hint">
      <h2 data-i18n="Your board is ready"></h2>
      <p data-i18n="Pick a shape, double-click to type, or draw with your pen."></p>
      <div class="keys">
        <span><kbd>R</kbd> <span data-i18n="Shapes"></span></span>
        <span><kbd>S</kbd> <span data-i18n="Note"></span></span>
        <span><kbd>T</kbd> <span data-i18n="Text"></span></span>
        <span><kbd>A</kbd> <span data-i18n="Connector"></span></span>
        <span><kbd>P</kbd> <span data-i18n="Pen"></span></span>
        <span><kbd data-i18n="Space"></kbd> <span data-i18n="Pan"></span></span>
      </div>
    </div>
  </main>

  <aside id="inspector" data-i18n-aria-label="Properties"></aside>
  <div id="toast" role="status"></div>
  <input id="file-input" type="file" accept="image/*" multiple hidden />

  <script type="module" src="js/app.js"></script>
</body>
</html>
